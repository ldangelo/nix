# AeroSpace Config - Leo D'Angelo
# https://nikitabobko.github.io/AeroSpace/commands
#
# Five workspaces:
#   D  Development   (tiles / columns)   WezTerm, Docker, Chrome
#   C  Communication (accordion)         Outlook, Mail, Slack, Teams, Messages
#   N  Notes         (accordion)         Obsidian, Granola, Claude
#   W  Documents     (tiles / columns)   Excel, Preview, Word
#   P  Personal      (accordion)         Music, Vivaldi, TradingView
# Utilities float globally (Zoom, Raycast, Passwords, Tailscale, Finder, Zima).

after-login-command = []
after-startup-command = [
  'exec-and-forget sleep 8 && ~/.config/aerospace/resort-windows.sh',
]

# Start AeroSpace at login (DISABLED)
start-at-login = false

# Normalizations OFF — stops AeroSpace from silently re-flattening / re-orienting
# the window tree. Main fix for "the screen keeps rearranging itself".
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Accordion padding
accordion-padding = 30

# Layout defaults: horizontal tiles = side-by-side COLUMNS.
# Tiles workspaces (D, W) use this default; accordion is applied per-app below.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

# Mouse follows focus when focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Disable macOS "Hide application" (cmd-h)
automatically-unhide-macos-hidden-apps = false

# Pin the five workspaces to the main monitor
[workspace-to-monitor-force-assignment]
D = 'main' # Development
C = 'main' # Communication
N = 'main' # Notes
W = 'main' # Documents
P = 'main' # Personal

[key-mapping]
preset = 'qwerty'

# Gaps
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

# ============================================================
# Main binding mode
# ============================================================
[mode.main.binding]

# Layout toggles
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-f = 'fullscreen'

# Focus (vim-style + arrows)
alt-h = 'focus left'
alt-left = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-right = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Swap windows (rearrange without changing layout)
ctrl-alt-h = 'swap left'
ctrl-alt-j = 'swap down'
ctrl-alt-k = 'swap up'
ctrl-alt-l = 'swap right'

# Resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Switch workspaces
alt-d = 'workspace D' # Development
alt-c = 'workspace C' # Communication
alt-n = 'workspace N' # Notes
alt-w = 'workspace W' # Documents
alt-p = 'workspace P' # Personal

# Move focused window to a workspace
alt-shift-d = 'move-node-to-workspace D'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-p = 'move-node-to-workspace P'

# Workspace navigation
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Enter service mode
alt-shift-semicolon = 'mode service'

# ============================================================
# Service binding mode
# ============================================================
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']                                # reset layout
f = ['layout floating tiling', 'mode main']                                # toggle floating
backspace = ['close-all-windows-but-current', 'mode main']
s = ['exec-and-forget ~/.config/aerospace/resort-windows.sh', 'mode main']
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ============================================================
# Window detection rules — auto-assign apps + set layout
# ============================================================

# ---------- Development (D) — tiles/columns ----------
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.electron.dockerdesktop'
run = ['move-node-to-workspace D']

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = ['move-node-to-workspace D']

# ---------- Communication (C) — accordion ----------
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace C', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace C', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace C', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace C', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['move-node-to-workspace C', 'layout accordion horizontal']

# ---------- Notes (N) — accordion ----------
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace N', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.granola.app'
run = ['move-node-to-workspace N', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = ['move-node-to-workspace N', 'layout accordion horizontal']

# ---------- Documents (W) — tiles/columns ----------
[[on-window-detected]]
if.app-id = 'com.microsoft.Excel'
run = ['move-node-to-workspace W']

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = ['move-node-to-workspace W']

[[on-window-detected]]
if.app-id = 'com.microsoft.Word'
run = ['move-node-to-workspace W']

# ---------- Personal (P) — accordion ----------
[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['move-node-to-workspace P', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.vivaldi.Vivaldi'
run = ['move-node-to-workspace P', 'layout accordion horizontal']

[[on-window-detected]]
if.app-id = 'com.tradingview.tradingviewapp.desktop'
run = ['move-node-to-workspace P', 'layout accordion horizontal']

# ============================================================
# Float rules — utilities / launchers / calls / dialogs (no workspace)
# ============================================================
[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'io.tailscale.ipn.macsys'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.raycast-x.macos'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.zimaspace.zima'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = ['layout floating']

# Float common transient dialogs regardless of app
[[on-window-detected]]
if.window-title-regex-substring = 'Settings'
run = ['layout floating']

[[on-window-detected]]
if.window-title-regex-substring = 'Preferences'
run = ['layout floating']
