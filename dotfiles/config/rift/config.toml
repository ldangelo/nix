# Rift config — Leo D'Angelo
# Copy to ~/.config/rift/config.toml
# https://github.com/acsandmann/rift/wiki/Config
#
# Six workspaces, each with its own layout mode:
#   0 Development   traditional (columns)   WezTerm, Docker, Chrome
#   1 Communication stack (accordion)       Outlook, Mail
#   2 Chat          stack (accordion)       Slack, Teams, Messages
#   3 Notes         stack (accordion)       Obsidian, Granola, Claude
#   4 Documents     traditional (columns)   Excel, Preview, Word
#   5 Personal      stack (accordion)       Music, Vivaldi, TradingView

[settings]
animate = true
animation_duration = 0.2
animation_fps = 100.0

# Click-to-focus (set focus_follows_mouse = true if you prefer hover-to-focus).
focus_follows_mouse = false
mouse_follows_focus = true
mouse_hides_on_focus = false

# Keep launchers / Spotlight from yanking you to another workspace.
auto_focus_blacklist = ["com.raycast-x.macos", "com.apple.Spotlight"]

# Auto-reload config on save.
hot_reload = true

[settings.layout]
mode = "traditional"

[settings.layout.stack]
# How much stacked (accordion) windows peek out.
stack_offset = 40.0
default_orientation = "perpendicular"

[settings.layout.gaps.outer]
top = 8
left = 8
bottom = 8
right = 8

[settings.layout.gaps.inner]
horizontal = 8
vertical = 8

[settings.ui.menu_bar]
enabled = true
show_empty = true
mode = "all"
active_label = "name"
display_style = "label"

[virtual_workspaces]
enabled = true
default_workspace_count = 6
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false

workspace_names = [
  "Development",
  "Communication",
  "Chat",
  "Notes",
  "Documents",
  "Personal",
]

# Per-workspace default layout. NOTE: the wiki's workspace_rules list omits
# "stack" while the command reference includes it. If Rift rejects "stack"
# here on load, use the Alt+Ctrl+S keybinding below to force a space to stack
# (that uses the documented set_workspace_layout command).
workspace_rules = [
  { workspace = "Development", layout = "traditional" },
  { workspace = "Communication", layout = "stack" },
  { workspace = "Chat", layout = "stack" },
  { workspace = "Notes", layout = "stack" },
  { workspace = "Documents", layout = "traditional" },
  { workspace = "Personal", layout = "stack" },
]

# App assignment (equivalent of AeroSpace on-window-detected).
app_rules = [
  # Development
  { app_id = "com.github.wez.wezterm", workspace = "Development" },
  { app_id = "com.electron.dockerdesktop", workspace = "Development" },
  { app_id = "com.google.Chrome", workspace = "Development" },

  # Communication (email)
  { app_id = "com.microsoft.Outlook", workspace = "Communication" },
  { app_id = "com.apple.mail", workspace = "Communication" },

  # Chat (stacked together)
  { app_id = "com.tinyspeck.slackmacgap", workspace = "Chat" },
  { app_id = "com.microsoft.teams2", workspace = "Chat" },
  { app_id = "com.apple.MobileSMS", workspace = "Chat" },

  # Notes
  { app_id = "md.obsidian", workspace = "Notes" },
  { app_id = "com.granola.app", workspace = "Notes" },
  { app_id = "com.anthropic.claudefordesktop", workspace = "Notes" },

  # Documents
  { app_id = "com.microsoft.Excel", workspace = "Documents" },
  { app_id = "com.apple.Preview", workspace = "Documents" },
  { app_id = "com.microsoft.Word", workspace = "Documents" },

  # Personal
  { app_id = "com.apple.Music", workspace = "Personal" },
  { app_id = "com.vivaldi.Vivaldi", workspace = "Personal" },
  { app_id = "com.tradingview.tradingviewapp.desktop", workspace = "Personal" },

  # Float (utilities / calls / dialogs)
  { app_id = "us.zoom.xos", floating = true },
  { app_id = "com.apple.Passwords", floating = true },
  { app_id = "com.apple.finder", floating = true },
  { app_id = "com.zimaspace.zima", floating = true },
  { title_substring = "Settings", floating = true },
  { title_substring = "Preferences", floating = true },

  # Ignore entirely (menu-bar / background)
  { app_id = "io.tailscale.ipn.macsys", manage = false },
  { app_id = "com.raycast-x.macos", manage = false },
]

[modifier_combinations]
comb1 = "Alt + Shift"

[keys]
# Focus (vim + arrows)
"Alt + H" = { move_focus = "left" }
"Alt + J" = { move_focus = "down" }
"Alt + K" = { move_focus = "up" }
"Alt + L" = { move_focus = "right" }
"Alt + Left" = { move_focus = "left" }
"Alt + Right" = { move_focus = "right" }

# Move window within layout
"comb1 + H" = { move_node = "left" }
"comb1 + J" = { move_node = "down" }
"comb1 + K" = { move_node = "up" }
"comb1 + L" = { move_node = "right" }

# Switch workspace
"Alt + D" = { switch_to_workspace = 0 } # Development
"Alt + C" = { switch_to_workspace = 1 } # Communication (email)
"Alt + S" = { switch_to_workspace = 2 } # Chat (Slack/Teams/Messages)
"Alt + N" = { switch_to_workspace = 3 } # Notes
"Alt + W" = { switch_to_workspace = 4 } # Documents
"Alt + P" = { switch_to_workspace = 5 } # Personal

# Move focused window to workspace
"comb1 + D" = { move_window_to_workspace = 0 }
"comb1 + C" = { move_window_to_workspace = 1 }
"comb1 + S" = { move_window_to_workspace = 2 }
"comb1 + N" = { move_window_to_workspace = 3 }
"comb1 + W" = { move_window_to_workspace = 4 }
"comb1 + P" = { move_window_to_workspace = 5 }

"Alt + Tab" = "switch_to_last_workspace"

# Layout controls
"Alt + Comma" = "toggle_stack"                   # stack/unstack the selected container
"Alt + Slash" = "toggle_orientation"
"Alt + Shift + Space" = "toggle_window_floating"
"Alt + F" = "toggle_fullscreen"
"Alt + Shift + Equal" = "resize_window_grow"
"Alt + Shift + Minus" = "resize_window_shrink"

# Force the ACTIVE workspace's layout mode (reliable fallback if workspace_rules
# won't accept "stack"): switch to the space, then press the combo.
"Alt + Ctrl + S" = { set_workspace_layout = { mode = "stack" } }        # stack/accordion
"Alt + Ctrl + T" = { set_workspace_layout = { mode = "traditional" } }  # columns
"Alt + Ctrl + B" = { set_workspace_layout = { mode = "bsp" } }
"Alt + Ctrl + M" = { set_workspace_layout = { mode = "master_stack" } }
